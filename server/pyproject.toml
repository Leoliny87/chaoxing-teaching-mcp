[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xuexitong-mcp"
dynamic = ["version"]
description = "MCP server for Chaoxing 学习通 (teacher and student web) through a local BrowserSkill browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9", "keyring>=24", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
xuexitong-mcp = "xuexitong_mcp.__main__:main"

[tool.setuptools]
packages = ["xuexitong_mcp"]

[tool.setuptools.dynamic]
version = {attr = "xuexitong_mcp.__version__"}

[tool.setuptools.package-data]
xuexitong_mcp = ["*.toml"]
