# Copy outside the repository to ~/.config/xuexitong-mcp/config.toml.
# No username, password, cookie or token belongs in this file.
# 角色：teacher（教师）/ reviewer（只读预审）/ student（学生）。
# 学生服务器上由教师设为 student；环境变量 XUEXITONG_MCP_PROFILE 只能收窄角色，不能放宽。
profile = "teacher"
write_allow_courses = []
upload_allow_dirs = []
cpi = ""
fid = ""
bsk_path = "bsk"

[timeouts]
command = 45
navigate = 40
upload = 120
settle = 1.5

[cache]
course_list_ttl = 600
course_ctx_ttl = 1800

[log]
level = "INFO"

[downloads]
dir = "~/Downloads/xuexitong-mcp"

[policy]
# 学生角色只能额外开放 list_my_discussions、reply_my_discussion；删除、发布、改他人内容、群发永远不会开放给学生。
extra_tools = []
deny_tools = []
# 不写时用角色默认值：student 每天 300 次、导航间隔 2 秒；reviewer 2000 次、1 秒；teacher 不限。
# daily_call_budget = 300
# min_nav_interval = 2.0
# 预审：除「拿不准」一律交教师外，其余结论随机抽查的比例
spot_check_rate = 0.2

[tutor]
# 教师部署的中心辅导服务（https）。token 是教师发给每个学生的辅导令牌，不是学习通密码。
url = ""
token = ""
timeout = 60

[update]
# `xuexitong-mcp update` 从这个 git 远端取发布版本（vX.Y.Z 标签）。
remote = "origin"
channel = "stable"          # stable：只要正式版；rc：也接受 vX.Y.ZrcN
# 学生服务器建议打开：只接受教师用 SSH 密钥签名的版本标签。
require_signed_tags = false
allowed_signers = ""        # 例如 "~/.config/xuexitong-mcp/allowed_signers"

[login]
# 首次登录引导：账号密码存系统 keyring（不在此文件），MCP 自动填表登录，滑块需本人完成。
auto_login = true        # 默认开：会话过期时用 keyring 凭据自动重登；设 false 或 env XUEXITONG_MCP_AUTO_LOGIN=0 关闭
login_account = ""       # 当前账号用户名（非密码）；运行 login 工具后填写
